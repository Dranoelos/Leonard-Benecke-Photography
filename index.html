  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Léonard Benecke Photography home">
        <span>Léonard Benecke</span>
        <small>Photography</small>
      </a>

      <nav id="site-nav" class="site-nav site-nav-direct" aria-label="Main navigation">
        <a href="#photography">Photography</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="top">
      <h1 class="sr-only">Léonard Benecke Photography in München</h1>

      <section class="hero" aria-label="Featured video">
        <video
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          poster="media/images/cover/cover-video-first-frame-20261026.jpg"
          data-hdr-src="media/videos/cover/cover-hdr.mp4"
          data-sdr-src="media/videos/cover/cover-sdr.mp4"
          data-low-hdr-src="media/videos/cover/cover-hdr-low.mp4"
          data-low-sdr-src="media/videos/cover/cover-sdr-low.mp4"
        >
          <img src="media/images/cover/cover-video-first-frame-20261026.jpg" alt="Open-air event with a guest wearing a white mask" fetchpriority="low" />
        </video>
        <div class="hero-meta">
          <p>Media Production</p>
          <p>München</p>
        </div>
      </section>

      <section id="photography" class="gallery-section gallery-feed" aria-label="Photography">
        <nav class="photo-filters" aria-label="Fotos filtern">
          <button type="button" data-photo-filter="all" aria-pressed="true" aria-controls="photography-grid">All</button>
          <button type="button" data-photo-filter="events" aria-pressed="false" aria-controls="photography-grid">Events</button>
          <button type="button" data-photo-filter="portraits" aria-pressed="false" aria-controls="photography-grid">Portraits</button>
        </nav>
        <p class="sr-only" data-gallery-status role="status" aria-live="polite"></p>
        <div id="photography-grid" class="photo-grid" data-gallery-feed></div>
      </section>

      <section id="contact" class="contact" aria-label="Contact">
        <p class="contact-note">Open to bookings</p>
        <div class="contact-links">
          <a id="contact-email" class="contact-link" href="mailto:benecke.leonard@gmail.com">benecke.leonard@gmail.com</a>
          <a class="contact-link" href="https://www.instagram.com/leonardbenecke/" rel="noopener noreferrer">@leonardbenecke</a>
        </div>
        <div class="contact-meta">
          <a href="impressum.html">Impressum</a>
          <a href="datenschutz.html">Privacy</a>
          <p>© <span id="year"></span> Léonard Benecke - München</p>
        </div>
      </section>
